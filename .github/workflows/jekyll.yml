name: Build and deploy Jekyll site

on:
  push:
    branches: ["main"] # Если ваша ветка называется master, замените на "master"
  workflow_dispatch:   # Позволяет запускать сборку вручную из вкладки Actions

# Права, необходимые для деплоя на GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Позволяет отменять предыдущие запуски, если вы делаете новый пуш
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest # GitHub Actions всегда использует Linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true # Автоматически кэширует гемы для ускорения

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        # Для репозитория типа username.github.io --baseurl не нужен. 
        # Если сайт будет в подпапке, добавьте: --baseurl "${{ steps.pages.outputs.base_path }}"
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4